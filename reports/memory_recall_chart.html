<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>记忆召回能力测试结果可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .card-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .charts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        .chart-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }
        .chart-box h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }
        canvas {
            max-height: 400px;
        }
        .chart-box.comparison {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧋 记忆召回能力测试结果可视化</h1>
        <p class="subtitle">测试时间: 2026-08-03 15:23:59 | 场景数: 11 | 窗口大小: 1轮, 3轮, 5轮, 7轮, 10轮</p>
        
        <div class="summary-cards">
            <div class="card">
                <div class="card-value">55</div>
                <div class="card-label">测试用例总数</div>
            </div>
            <div class="card">
                <div class="card-value">100%</div>
                <div class="card-label">最低准确率</div>
            </div>
            <div class="card">
                <div class="card-value">0</div>
                <div class="card-label">失败用例数</div>
            </div>
            <div class="card">
                <div class="card-value">5</div>
                <div class="card-label">测试窗口数</div>
            </div>
        </div>
        
        <div class="charts">
            <div class="chart-box comparison">
                <h3>📊 各场景在不同窗口下的命中率对比</h3>
                <canvas id="scenarioChart"></canvas>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                <div class="chart-box">
                    <h3>📈 不同窗口大小下的总体准确率</h3>
                    <canvas id="accuracyChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>⏱️ 不同窗口大小下的平均响应耗时</h3>
                    <canvas id="timeChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chartData = {"windows": ["1轮", "3轮", "5轮", "7轮", "10轮"], "overall_acc": [100.0, 100.0, 100.0, 100.0, 100.0], "avg_times": [49.9, 30.7, 29.6, 32.3, 30.0], "scenario_data": {"糖度记忆": [100, 100, 100, 100, 100], "冰量记忆": [100, 100, 100, 100, 100], "订单号记忆": [100, 100, 100, 100, 100], "位置记忆": [100, 100, 100, 100, 100], "饮品偏好记忆": [100, 100, 100, 100, 100], "投诉内容记忆": [100, 100, 100, 100, 100], "价格记忆": [100, 100, 100, 100, 100], "复合指代": [100, 100, 100, 100, 100], "加料记忆": [100, 100, 100, 100, 100], "温度记忆": [100, 100, 100, 100, 100], "杯型记忆": [100, 100, 100, 100, 100]}};
        
        // 场景命中率对比图
        new Chart(document.getElementById('scenarioChart'), {
            type: 'bar',
            data: {
                labels: chartData.windows,
                datasets: [
                    {
                        label: '各窗口综合 (基准)',
                        data: [100, 100, 100, 100, 100],
                        backgroundColor: '#667eea',
                        borderColor: '#667eea',
                        borderWidth: 2,
                        type: 'line',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '准确率 (%)',
                        position: 'top'
                    },
                    legend: {
                        position: 'bottom'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 110,
                        title: {
                            display: true,
                            text: '命中率 (%)'
                        }
                    }
                }
            }
        });

        // 各场景分别展示
        const scenarioDatasets = [];
        const colors = ['#2196F3', '#4CAF50', '#FF9800', '#9C27B0', '#F44336', '#00BCD4', 
                        '#795548', '#607D8B', '#E91E63', '#8BC34A', '#FFC107'];
        
        Object.keys(chartData.scenario_data).forEach((name, idx) => {
            const color = colors[idx % colors.length];
            scenarioDatasets.push({
                label: name,
                data: chartData.scenario_data[name],
                backgroundColor: color + 'cc',
                borderColor: color,
                borderWidth: 2,
                pointRadius: 6,
                tension: 0.3
            });
        });

        new Chart(document.getElementById('scenarioChart').parentNode.querySelector('canvas'), {
            type: 'bar',
            data: {
                labels: chartData.windows,
                datasets: scenarioDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { font: { size: 10 } }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 110,
                        title: {
                            display: true,
                            text: '命中率 (%)'
                        }
                    }
                }
            }
        });

        // 总体准确率
        new Chart(document.getElementById('accuracyChart'), {
            type: 'line',
            data: {
                labels: chartData.windows,
                datasets: [{
                    label: '总体准确率',
                    data: chartData.overall_acc,
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 8,
                    pointBackgroundColor: '#667eea',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 110,
                        title: {
                            display: true,
                            text: '准确率 (%)'
                        }
                    }
                }
            }
        });

        // 耗时对比
        new Chart(document.getElementById('timeChart'), {
            type: 'bar',
            data: {
                labels: chartData.windows,
                datasets: [{
                    label: '平均响应耗时',
                    data: chartData.avg_times,
                    backgroundColor: [
                        'rgba(33, 150, 243, 0.8)',
                        'rgba(76, 175, 80, 0.8)',
                        'rgba(255, 152, 0, 0.8)',
                        'rgba(156, 39, 176, 0.8)',
                        'rgba(244, 67, 54, 0.8)'
                    ],
                    borderColor: [
                        '#2196F3', '#4CAF50', '#FF9800', '#9C27B0', '#F44336'
                    ],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '耗时 (ms)'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
